<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Las Varillas · ¿cómo puedo ayudarte?</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--blue:#00aeef;--yellow:#ffcb2d;--ink:#111}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{font-family:Poppins,system-ui,sans-serif;background:var(--blue);color:var(--ink)}
  .bg{position:fixed;inset:0;width:100%;height:100%}
  .logo{position:fixed;left:22px;top:30px;width:120px;z-index:3}

  /* buscador */
  .pill{position:fixed;left:150px;top:62px;width:min(560px,calc(100vw - 175px));height:72px;z-index:3;display:flex;align-items:center;gap:18px;padding:0 26px;background:#fff;border-radius:40px;box-shadow:6px 8px 12px rgba(0,60,100,.35)}
  .pill input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:1.35rem;color:var(--ink);background:none}
  .pill input::placeholder{color:#222;opacity:1}
  .dot{width:10px;height:10px;border-radius:50%;background:#bbb;flex-shrink:0}.dot.ok{background:#22c55e}

  /* respuesta */
  .answer{position:fixed;left:150px;top:150px;width:min(560px,calc(100vw - 175px));max-height:calc(100vh - 330px);overflow-y:auto;z-index:3;background:rgba(255,255,255,.96);border-radius:26px;padding:20px 26px;box-shadow:6px 8px 14px rgba(0,60,100,.3);white-space:pre-wrap;line-height:1.6;font-size:.98rem;display:none}
  .answer small{display:block;color:#0090c5;font-weight:600;margin-bottom:6px}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--blue);border-top-color:transparent;border-radius:50%;animation:r .8s linear infinite;margin-right:8px;vertical-align:-2px}
  @keyframes r{to{transform:rotate(360deg)}}

  /* menú abajo a la derecha */
  #burger{position:fixed;right:34px;bottom:36px;width:46px;background:none;border:0;cursor:pointer;z-index:40;padding:6px 0}
  #burger i{display:block;height:6px;border-radius:4px;background:#b9b9b9;margin:6px 0}
  #nav{position:fixed;right:30px;bottom:34px;z-index:40;display:none;align-items:stretch;gap:14px;text-align:right}
  #nav.on{display:flex}
  #nav ul{list-style:none;margin:0;padding:0}
  #nav li{margin:8px 0}
  #nav a{cursor:pointer;font-size:1.35rem;color:var(--ink);text-decoration:none;display:inline-block}
  #nav a.l::before{content:"•";margin-right:14px}
  #nav a.h{font-weight:700;color:var(--blue);text-transform:uppercase;font-size:1.2rem}
  #nav a.act{text-decoration:underline;text-underline-offset:6px}
  #nav .bar{width:5px;background:#9a9a9a;border:0;padding:0;cursor:pointer;border-radius:3px}

  /* fondo borroso + panel centrado */
  #ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:30px 30px 110px;background:rgba(255,255,255,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  #ov.on{display:flex;animation:f .3s}
  @keyframes f{from{opacity:0}}
  .panel{width:min(900px,100%);max-height:100%;overflow-y:auto;background:rgba(255,255,255,.93);border-radius:30px;padding:30px 34px;box-shadow:0 20px 50px rgba(0,50,90,.35)}
  .panel h2{margin:0 0 4px;font-size:1.6rem}
  .panel .sub{color:#0090c5;font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;margin-bottom:22px}
  .shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px}
  .book{cursor:pointer;border:0;text-align:left;font:inherit;padding:0;border-radius:6px 14px 14px 6px;overflow:hidden;box-shadow:5px 7px 0 rgba(0,0,0,.14);transition:.2s;min-height:230px;display:flex;flex-direction:column;border-left:14px solid rgba(0,0,0,.18)}
  .book:hover{transform:translateY(-6px) rotate(-1deg)}
  .book .t{flex:1;padding:18px 14px;font-weight:700;font-size:1rem;line-height:1.3}
  .book .c{padding:10px 14px;font-size:.7rem;font-weight:600;background:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.06em}
  .b0{background:var(--blue);color:#fff}.b1{background:var(--yellow)}.b2{background:#fff;border:1px solid #ddd;border-left:14px solid var(--blue)}.b3{background:#222;color:#fff}
  .back{border:0;background:none;color:#0090c5;font:inherit;font-weight:600;cursor:pointer;margin-bottom:14px;padding:0}
  .reader p{line-height:1.8;font-size:1.02rem;white-space:pre-wrap}
  .tags span{display:inline-block;font-size:.72rem;background:#e8f7fd;color:#007aa8;border-radius:99px;padding:3px 11px;margin:0 6px 6px 0}
  .hist{display:flex;flex-direction:column;gap:12px}
  .m{max-width:84%;padding:11px 16px;border-radius:20px;white-space:pre-wrap;line-height:1.55;font-size:.94rem}
  .m.u{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
  .m.a{align-self:flex-start;background:#fff4cc;border-bottom-left-radius:4px}
  .empty{color:#666;text-align:center;padding:30px}
  .banner{background:#fff4cc;border-radius:12px;padding:8px 14px;font-size:.8rem;margin-bottom:16px}
  @media(max-width:700px){.logo{width:70px;left:10px;top:36px}.pill{left:88px;width:calc(100vw - 104px);height:60px;top:46px}.pill input{font-size:1.05rem}.answer{left:16px;width:calc(100vw - 32px);top:124px}}
</style>
</head>
<body>

<!-- Fondo -->
<svg class="bg" viewBox="0 0 1074 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <rect width="1074" height="640" fill="#00aeef"/>
  <path fill="#ffcb2d" stroke="#ffcb2d" stroke-width="3" stroke-linejoin="round"
    d="M0 300 L78 314 L55 360 L95 390 L100 436 L122 460 L170 448 L165 495 L260 488 L236 536 L300 578 L350 512 L440 430 L396 556 L422 592 L470 522 L525 438 L560 366 L600 300 L626 284 L596 382 L642 322 L690 242 L716 210 L682 302 L662 322 L752 232 L796 174 L746 252 L792 202 L862 162 L826 216 L872 196 L926 164 L900 202 L946 186 L1002 186 L1074 196 L1074 640 L0 640 Z"/>
</svg>

<!-- Logo (engranaje) -->
<svg class="logo" viewBox="0 0 120 90" aria-hidden="true">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e5e5e5"/><stop offset="1" stop-color="#6d6d6d"/></linearGradient></defs>
  <g transform="translate(46 50)">
    <g fill="url(#g)">
      <circle r="24"/>
      <g id="teeth"><rect x="-5" y="-33" width="10" height="12" rx="2"/><rect x="-5" y="-33" width="10" height="12" rx="2" transform="rotate(45)"/><rect x="-5" y="-33" width="10" height="12" rx="2" transform="rotate(90)"/><rect x="-5" y="-33" width="10" height="12" rx="2" transform="rotate(135)"/><rect x="-5" y="-33" width="10" height="12" rx="2" transform="rotate(180)"/><rect x="-5" y="-33" width="10" height="12" rx="2" transform="rotate(225)"/><rect x="-5" y="-33" width="10" height="12" rx="2" transform="rotate(270)"/><rect x="-5" y="-33" width="10" height="12" rx="2" transform="rotate(315)"/></g>
    </g>
    <circle r="15" fill="#ffcb2d"/><circle r="8" fill="#00aeef"/>
  </g>
  <path d="M30 88 C60 40 90 8 118 8 C88 14 70 40 52 88 Z" fill="#fff" opacity=".95"/>
</svg>

<!-- Buscador -->
<form class="pill" id="form">
  <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#6b6b6b" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/></svg>
  <input id="inp" type="text" placeholder="¿cómo puedo ayudarte…?" autocomplete="off" autofocus>
  <span class="dot" id="dot" title="Estado del servidor"></span>
</form>
<div class="answer" id="answer"></div>

<!-- Menú -->
<button id="burger" aria-label="Abrir menú"><i></i><i></i><i></i></button>
<nav id="nav">
  <ul>
    <li><a class="l" id="goLibros">Libros, Las Varillas</a></li>
    <li><a class="h" id="goChat">Historial de chat</a></li>
  </ul>
  <button class="bar" id="closeNav" aria-label="Cerrar menú"></button>
</nav>

<!-- Overlay borroso -->
<div id="ov"><div class="panel" id="panel"></div></div>

<script>
const WS_URL = "ws://localhost:8000/ws/chat";
const API = "http://localhost:8000/api/fundacion";
const $ = id => document.getElementById(id);

const FALLBACK = [
 {id:"teoria_1900",titulo:"Teoría de 1900: origen simbólico",contenido:"Se sostuvo durante años que Las Varillas nació en 1900. La defiende el Centro de Estudios Históricos Parada KM 81 (Rubén Arce, Irene Peralta de Baldrich y Oscar Valletto): ya había población estable antes del ferrocarril, con estancias y familias criollas. Citan un documento de 1853 sobre Don Ramón Álvarez y una mención del paraje en 1813.",tags:["1900","Parada KM 81"],metadata:{criterio:"Demográfico"}},
 {id:"teoria_1903",titulo:"Teoría de 1903: acto fundacional",contenido:"Impulsada por Omar Rubiolo y Valter Dabbene, que consideran fundador a José Medardo Álvarez. Su evidencia: la escritura de donación de tierras del 26 de marzo de 1903 (familia Álvarez Luque) y el primer plano urbano. Ferreyra Bertone y Marchetti reforzaron esta postura con nueva documentación.",tags:["1903","Valter Dabbene"],metadata:{criterio:"Jurídico-documental"}},
 {id:"teoria_1904",titulo:"Teoría de 1904: llegada del tren",contenido:"El pueblo se consolidó cuando funcionó la estación y pasó el primer tren, lo que impulsó el crecimiento, el comercio y la llegada de inmigrantes. El ferrocarril es visto como el motor del nacimiento urbano.",tags:["1904","ferrocarril"],metadata:{criterio:"Económico-funcional"}},
 {id:"fecha_oficial",titulo:"Fecha oficial: 7 de octubre",contenido:"La Carta Orgánica Municipal fija el 7 de octubre, día de Nuestra Señora del Rosario, patrona local, para los actos cívicos y celebraciones oficiales.",tags:["7 de octubre"],metadata:{criterio:"Institucional"}}
];

let libros = FALLBACK, offline = true;
const hist = [];
let ws, busy = false, vista = null;

/* ---------- Menú y overlay ---------- */
$("burger").onclick = () => { $("burger").style.display = "none"; $("nav").classList.add("on"); };
$("closeNav").onclick = () => { cerrar(); $("nav").classList.remove("on"); $("burger").style.display = "block"; };
$("goLibros").onclick = () => abrir("libros");
$("goChat").onclick = () => abrir("chat");
$("ov").onclick = e => { if (e.target === $("ov")) cerrar(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") cerrar(); });

function abrir(v){
  if (vista === v) return cerrar();
  vista = v; $("ov").classList.add("on");
  $("goLibros").classList.toggle("act", v === "libros"); $("goChat").classList.toggle("act", v === "chat");
  v === "libros" ? pintarLibros() : pintarHist();
}
function cerrar(){ vista = null; $("ov").classList.remove("on"); $("goLibros").classList.remove("act"); $("goChat").classList.remove("act"); }
function el(tag, cls, txt){ const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

function pintarLibros(){
  const p = $("panel"); p.innerHTML = "";
  p.append(el("h2", "", "Libros, Las Varillas"), el("div", "sub", "Biblioteca histórica digital"));
  if (offline) p.append(el("div", "banner", "Mostrando copia local de los documentos (backend sin conexión)."));
  const shelf = el("div", "shelf");
  libros.forEach((d, i) => {
    const b = el("button", "book b" + (i % 4));
    b.append(el("div", "t", d.titulo), el("div", "c", (d.metadata && d.metadata.criterio) || "Documento"));
    b.onclick = () => leer(d);
    shelf.append(b);
  });
  p.append(shelf);
}
function leer(d){
  const p = $("panel"); p.innerHTML = "";
  const back = el("button", "back", "← Volver a los libros"); back.onclick = pintarLibros;
  const r = el("div", "reader");
  const tags = el("div", "tags"); (d.tags || []).forEach(t => tags.append(el("span", "", t)));
  r.append(el("h2", "", d.titulo), el("div", "sub", (d.metadata && d.metadata.criterio) || ""), el("p", "", d.contenido), tags);
  p.append(back, r);
}
function pintarHist(){
  const p = $("panel"); p.innerHTML = "";
  p.append(el("h2", "", "Historial de chat"), el("div", "sub", "Libros, Las Varillas"));
  if (!hist.length) { p.append(el("div", "empty", "Todavía no hiciste ninguna pregunta. Escribí arriba en el buscador.")); return; }
  const h = el("div", "hist"); hist.forEach(m => h.append(el("div", "m " + m.r, m.t))); p.append(h);
}

/* ---------- Respuesta ---------- */
function mostrar(pregunta, html, esEstado){
  const a = $("answer"); a.style.display = "block"; a.innerHTML = "";
  a.append(el("small", "", pregunta));
  if (esEstado) { const s = el("span", "spin"); a.append(s, document.createTextNode(html)); }
  else a.append(document.createTextNode(html));
  a.scrollTop = 0;
}
let ultima = "";

/* ---------- Conexión ---------- */
async function cargar(){
  try { const r = await fetch(API); if (!r.ok) throw 0; libros = (await r.json()).raw; offline = false; } catch { offline = true; }
}
function conectar(){
  ws = new WebSocket(WS_URL);
  ws.onopen = () => $("dot").classList.add("ok");
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === "status") return mostrar(ultima, m.message, true);
    const txt = m.type === "error" ? "Error: " + m.message : m.content;
    mostrar(ultima, txt); hist.push({r: "a", t: txt}); busy = false;
    if (vista === "chat") pintarHist();
  };
  ws.onclose = () => { $("dot").classList.remove("ok"); busy = false; setTimeout(conectar, 3000); };
}
$("form").addEventListener("submit", e => {
  e.preventDefault();
  const t = $("inp").value.trim(); if (!t || busy) return;
  if (!ws || ws.readyState !== WebSocket.OPEN){ mostrar(t, "El servidor no está disponible. Inicia el backend (python backend/main.py) y Ollama."); return; }
  ultima = t; busy = true; hist.push({r: "u", t});
  mostrar(t, "Enviando mensaje...", true);
  ws.send(JSON.stringify({text: t})); $("inp").value = "";
  if (vista === "chat") pintarHist();
});

cargar(); conectar();
</script>
</body>
</html>
